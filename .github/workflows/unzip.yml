
name: Prepare AB Wallet

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AB_WALLET_TOKEN }}
          persist-credentials: true

      - name: Extract project files
        run: |
          set -e
          test -f AB-Wallet-Android.zip
          mkdir -p _abwallet_extract
          unzip -o AB-Wallet-Android.zip -d _abwallet_extract
          test -d _abwallet_extract/AB-Wallet-Android
          cp -a _abwallet_extract/AB-Wallet-Android/. .
          rm -rf _abwallet_extract

      - name: Save files to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add AB Wallet project files"
            git push
          fi
